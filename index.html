<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book Scanner Pro v3.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Serif+JP:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #080808; color: #e5e5e5; overflow-x: hidden; }
        .serif { font-family: 'Noto Serif JP', serif; }
        
        /* プレミアムなスキャンアニメーション */
        .scan-animation { animation: scan 2s ease-in-out infinite; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        .bg-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input:focus, textarea:focus { outline: none; border-color: #3b82f6 !important; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="app-container" class="max-w-md mx-auto w-full flex-1 flex flex-col relative">
        <!-- HEADER -->
        <header class="p-6 flex justify-between items-center sticky top-0 z-50 bg-[#080808]/80 backdrop-blur-md border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white shadow-lg shadow-blue-600/40">B</div>
                <h1 class="font-black tracking-tighter text-lg uppercase italic text-white/90">Scanner <span class="text-blue-500">v3.9</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="p-2.5 bg-white/5 text-white/60 rounded-xl hover:bg-white/10 transition-all active:scale-90">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 pb-24 overflow-y-auto">
            <!-- PREVIEW AREA -->
            <div id="preview-area" class="relative mt-8 rounded-[2.5rem] bg-[#111] aspect-[3/4] overflow-hidden border border-white/10 shadow-2xl transition-all flex items-center justify-center group">
                <input type="file" id="file-input" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                
                <div id="placeholder-ui" class="text-center group-hover:scale-105 transition-transform duration-500">
                    <div class="w-20 h-20 bg-blue-600/10 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-600/20">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <p class="text-[10px] font-black tracking-[0.5em] text-white/40 uppercase">Tap to Scan Page</p>
                </div>

                <img id="image-display" class="hidden absolute inset-0 w-full h-full object-cover">
                <div id="scan-line" class="hidden absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent shadow-[0_0_25px_#3b82f6] z-10 scan-animation"></div>
            </div>

            <!-- ACTION AREA -->
            <div id="action-area" class="mt-10">
                <button id="analyze-btn" class="hidden w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl text-white font-black text-sm active:scale-[0.97] transition-all uppercase tracking-[0.25em] shadow-xl shadow-blue-600/20">Analyze with Gemini</button>
                
                <div id="loading-ui" class="hidden py-12 space-y-6 text-center">
                    <div class="relative inline-block">
                        <div class="w-12 h-12 border-4 border-blue-500/10 border-t-blue-500 rounded-full animate-spin"></div>
                    </div>
                    <p class="text-[10px] font-bold text-white/30 uppercase tracking-[0.3em] animate-pulse">Processing Artifact...</p>
                </div>
            </div>

            <!-- RESULT VIEW -->
            <div id="result-view" class="hidden mt-10 space-y-8 fade-in pb-12">
                <div class="bg-glass rounded-[2rem] p-8 space-y-8 border border-white/10 shadow-2xl">
                    <div class="flex justify-between items-center border-b border-white/5 pb-5">
                        <span class="text-[10px] font-black text-blue-400 uppercase tracking-[0.2em]">Insight Extracted</span>
                        <button onclick="resetApp()" class="text-[10px] font-bold text-white/30 hover:text-white/60 transition-colors uppercase tracking-widest">Discard</button>
                    </div>

                    <div class="space-y-3">
                        <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">The Core Quote</label>
                        <textarea id="quote-field" class="w-full bg-black/40 p-5 rounded-2xl text-lg serif leading-relaxed text-white/90 border border-white/5 transition-all resize-none" rows="5"></textarea>
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                        <div class="space-y-2">
                            <label class="text-[9px] font-black text-white/30 uppercase tracking-widest ml-1">Book Title</label>
                            <input id="book-field" class="w-full bg-black/40 p-4 rounded-xl text-sm font-bold border border-white/5">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-[9px] font-black text-white/30 uppercase tracking-widest ml-1">Author</label>
                                <input id="author-field" class="w-full bg-black/40 p-4 rounded-xl text-sm font-bold border border-white/5">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[9px] font-black text-white/30 uppercase tracking-widest ml-1">Page</label>
                                <input id="page-field" type="text" class="w-full bg-black/40 p-4 rounded-xl text-sm font-bold border border-white/5">
                            </div>
                        </div>
                    </div>
                    
                    <textarea id="fulltext-field" class="hidden"></textarea>
                </div>

                <button id="notion-btn" class="w-full bg-white text-black py-5 rounded-2xl font-black text-sm flex items-center justify-center gap-3 active:scale-[0.97] transition-all shadow-2xl shadow-white/5">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4.459 4.218c.856-.472 2.012-.763 3.441-.856l11.455-.744a1 1 0 0 1 1.066.983v15.8a1 1 0 0 1-.956.998l-12.115.787a1 1 0 0 1-1.065-.983V4.218zm1.903.856V19.81l9.143-.594V5.668l-9.143.594z"/></svg>
                    Export to Notion
                </button>
            </div>
        </main>

        <!-- CONFIG MODAL -->
        <div id="config-modal" class="hidden fixed inset-0 bg-[#080808]/95 z-[100] backdrop-blur-3xl flex flex-col justify-center p-8">
            <div class="max-w-xs mx-auto w-full space-y-10">
                <div>
                    <h2 class="text-4xl font-black italic tracking-tighter text-white">SYSTEM<br>CONFIG</h2>
                    <p class="text-[10px] text-white/30 font-bold mt-2 tracking-widest uppercase">Connectivity Settings</p>
                </div>
                <div class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-white/40 uppercase tracking-[0.2em]">Google Gemini API Key</label>
                        <input type="password" id="api-key-input" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none text-sm font-mono" placeholder="AI Studio API Key">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-white/40 uppercase tracking-[0.2em]">Notion GAS URL</label>
                        <input type="text" id="gas-url" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none text-[10px] font-mono" placeholder="https://script.google.com/...">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="toggleConfig()" class="flex-1 bg-white/5 p-5 rounded-2xl font-bold text-xs text-white/40 active:scale-95 transition-all">Cancel</button>
                    <button onclick="saveConfig()" class="flex-[2] bg-blue-600 p-5 rounded-2xl font-black text-sm active:scale-95 transition-all shadow-xl shadow-blue-600/30">Save Config</button>
                </div>
            </div>
        </div>

        <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-10 py-5 rounded-2xl text-xs font-black shadow-2xl z-[200] fade-in"></div>
    </div>

    <script>
        const el = id => document.getElementById(id);
        let base64Image = "";

        function toggleConfig() { el('config-modal').classList.toggle('hidden'); }
        function saveConfig() {
            localStorage.setItem('gas_url', el('gas-url').value.trim());
            localStorage.setItem('gemini_api_key', el('api-key-input').value.trim());
            toggleConfig();
            showToast("✓ SYSTEM UPDATED");
        }

        function showToast(m, isErr = false) {
            const t = el('toast');
            t.textContent = m; 
            t.style.backgroundColor = isErr ? "#ef4444" : "white";
            t.style.color = isErr ? "white" : "black";
            t.classList.remove('hidden');
            setTimeout(() => { t.classList.add('hidden') }, 4000);
        }

        function resetApp() {
            el('result-view').classList.add('hidden'); el('placeholder-ui').classList.remove('hidden');
            el('image-display').classList.add('hidden'); el('analyze-btn').classList.add('hidden');
            el('file-input').value = "";
        }

        el('file-input').onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                base64Image = ev.target.result.split(',')[1];
                el('image-display').src = ev.target.result; el('image-display').classList.remove('hidden');
                el('placeholder-ui').classList.add('hidden'); el('analyze-btn').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };

        // --- GEMINI v3.9 ENGINE (Fixing "Not Found" Error) ---
        async function runGeminiAnalysis(key, b64) {
            // URLから 'models/' を外して動的に結合する方式に変更
            const modelNames = ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-2.0-flash-exp"];
            
            const prompt = `画像から書籍情報を抽出しJSON形式で返してください。
【quote】は最も重要または印象的な一節。
【full_text】は認識できる全テキスト。
chapter(章)などもあれば抽出してください。
{ "quote": "...", "full_text": "...", "chapter": "...", "book_title": "...", "author": "...", "page": "..." }`;

            const payload = {
                contents: [{ parts: [
                    { text: prompt },
                    { inlineData: { mimeType: "image/png", data: b64 } }
                ]}]
            };

            let lastError = "";

            for (const mName of modelNames) {
                // v1beta を優先使用し、モデル名にプレフィックスを付けない形式
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${mName}:generateContent?key=${key}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    
                    if (response.ok) return data;
                    
                    // エラーメッセージのログ（デバッグ用）
                    console.error(`Attempt with ${mName} failed:`, data.error?.message);
                    lastError = data.error?.message || "Unknown error";
                } catch (e) {
                    console.error(`Fetch error with ${mName}:`, e);
                    lastError = e.message;
                }
            }
            throw new Error(`分析に失敗しました。キーが正しいか確認してください。\n(Last Error: ${lastError})`);
        }

        el('analyze-btn').onclick = async () => {
            const key = localStorage.getItem('gemini_api_key');
            if (!key) { showToast("API KEY REQUIRED", true); toggleConfig(); return; }

            el('analyze-btn').classList.add('hidden'); 
            el('loading-ui').classList.remove('hidden'); 
            el('scan-line').classList.remove('hidden');
            
            try {
                const data = await runGeminiAnalysis(key, base64Image);
                let text = data.candidates[0].content.parts[0].text;
                
                // JSONの抽出 (Markdownタグが含まれる場合を考慮)
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("JSON形式のレスポンスを取得できませんでした。");
                
                const result = JSON.parse(jsonMatch[0]);
                
                el('quote-field').value = result.quote || "";
                el('fulltext-field').value = result.full_text || "";
                el('book-field').value = result.book_title || "";
                el('author-field').value = result.author || "";
                el('page-field').value = result.page || "";
                
                el('loading-ui').classList.add('hidden'); 
                el('result-view').classList.remove('hidden');
                showToast("✓ INTELLIGENCE EXTRACTED");
            } catch (err) {
                showToast("CRITICAL: " + err.message, true);
                el('analyze-btn').classList.remove('hidden'); 
                el('loading-ui').classList.add('hidden');
            } finally { 
                el('scan-line').classList.add('hidden'); 
            }
        };

        el('notion-btn').onclick = async () => {
            const url = localStorage.getItem('gas_url');
            if (!url) { showToast("GAS URL REQUIRED", true); toggleConfig(); return; }
            
            const originalText = el('notion-btn').innerHTML;
            el('notion-btn').disabled = true; 
            el('notion-btn').textContent = "UPLOADING...";
            
            const payload = {
                action: "create",
                quote: el('quote-field').value,
                full_text: el('fulltext-field').value,
                book_title: el('book-field').value,
                author: el('author-field').value,
                page: el('page-field').value
            };

            try {
                // GASはCORS制限があるため no-cors モードで送信
                await fetch(url, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload) 
                });
                showToast("✓ PERSISTED TO NOTION");
                setTimeout(resetApp, 1500);
            } catch (e) { 
                showToast("SYNC FAILED", true); 
            } finally { 
                el('notion-btn').disabled = false; 
                el('notion-btn').innerHTML = originalText; 
            }
        };

        window.onload = () => {
            el('gas-url').value = localStorage.getItem('gas_url') || "";
            el('api-key-input').value = localStorage.getItem('gemini_api_key') || "";
            if (!localStorage.getItem('gemini_api_key')) {
                setTimeout(toggleConfig, 1000);
            }
        };
    </script>
</body>
</html>
